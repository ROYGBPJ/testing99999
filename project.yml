name: NovaVideo
options:
  bundleIdPrefix: com.royroy
  deploymentTarget:
    iOS: "16.0"
targets:
  NovaVideo:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.royroy.novavideo
        PRODUCT_NAME: Nova Video
        INFOPLIST_KEY_CFBundleDisplayName: Nova Video
        INFOPLIST_KEY_YOUTUBE_API_KEY: $(YOUTUBE_API_KEY)
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: NO

name: Recovery Search Tests
on:
  push:
    paths:
      - "RecoverySource/Tests/**"
      - "RecoverySource/Package.swift"
      - "RecoverySource/Sources/**"
      - ".github/workflows/recovery-search-tests.yml"
  pull_request:
    paths:
      - "RecoverySource/Tests/**"
      - "RecoverySource/Package.swift"
      - "RecoverySource/Sources/**"
      - ".github/workflows/recovery-search-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: RecoverySource
    steps:
      - uses: actions/checkout@v4
      - name: Run search-service unit tests
        run: swift test

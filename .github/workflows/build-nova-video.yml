name: Build Nova Video replacement IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "App/**"
      - "project.yml"
      - ".github/workflows/build-nova-video.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          xcodebuild -project NovaVideo.xcodeproj -scheme NovaVideo -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/NovaVideo.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NovaVideo-unsigned.ipa
          unzip -t NovaVideo-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NovaVideo-unsigned-ipa
          path: NovaVideo-unsigned.ipa

name: Build Nova Video replacement IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "App/**"
      - "project.yml"
      - ".github/workflows/build-nova-video.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          xcodebuild -project NovaVideo.xcodeproj -scheme NovaVideo -sdk iphoneos -configuration Release -derivedDataPath build YOUTUBE_API_KEY="${YOUTUBE_API_KEY}" CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          PRODUCTS="build/Build/Products/Release-iphoneos"
          echo "Looking for built .app in $PRODUCTS"
          ls -la "$PRODUCTS"
          APP="$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::No .app bundle found in $PRODUCTS"
            exit 1
          fi
          echo "Packaging app: $APP"
          rm -rf Payload NovaVideo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          echo "Checking app bundle contents..."
          ls -la Payload
          echo "Creating IPA archive..."
          /usr/bin/zip -r NovaVideo-unsigned.ipa Payload
          echo "Checking IPA archive..."
          /usr/bin/unzip -t NovaVideo-unsigned.ipa
          echo "IPA packaging and validation completed."
      - uses: actions/upload-artifact@v4
        with:
          name: NovaVideo-unsigned-ipa
          path: NovaVideo-unsigned.ipa

name: Build and Sign iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Payload/**"
      - ".github/workflows/build-sign-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d Payload/Y.app
          test -f Payload/Y.app/Info.plist
          plutil -lint Payload/Y.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Y.app/Info.plist
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/Y.app/Info.plist)
          test -n "$EXECUTABLE"
          test -s "Payload/Y.app/$EXECUTABLE"
          echo "Validated executable: $EXECUTABLE"

      - name: Prepare signing inputs
        id: signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$IOS_P12_BASE64" && -n "$IOS_P12_PASSWORD" && -n "$IOS_PROVISION_PROFILE_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not all configured; an unsigned IPA will be produced."
          fi

      - name: Sign app with Apple Development certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          ENTITLEMENTS="$RUNNER_TEMP/entitlements.plist"

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$PROFILE_PLIST" > "$ENTITLEMENTS"
          cp "$PROFILE_PATH" Payload/Y.app/embedded.mobileprovision

          APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Y.app/Info.plist)
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"
          if [[ "$PROFILE_BUNDLE_ID" != "$APP_BUNDLE_ID" && "$PROFILE_BUNDLE_ID" != "*" ]]; then
            echo "Provisioning profile bundle ID ($PROFILE_BUNDLE_ID) does not match app ($APP_BUNDLE_ID)." >&2
            exit 1
          fi

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/Apple Development:/ {print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            echo "No Apple Development signing identity was found in the supplied .p12." >&2
            exit 1
          fi

          codesign --force --deep --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" --timestamp=none Payload/Y.app
          codesign --verify --deep --strict --verbose=2 Payload/Y.app

      - name: Validate app bundle before packaging
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint Payload/Y.app/Info.plist
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/Y.app/Info.plist)
          test -s "Payload/Y.app/$EXECUTABLE"
          echo "App executable size: $(stat -f%z "Payload/Y.app/$EXECUTABLE") bytes"

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload build/Nova_Video_v15.ipa
          unzip -t build/Nova_Video_v15.ipa
          unzip -Z1 build/Nova_Video_v15.ipa | grep -Fx 'Payload/Y.app/Info.plist'
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/Y.app/Info.plist)
          unzip -Z1 build/Nova_Video_v15.ipa | grep -Fx "Payload/Y.app/$EXECUTABLE"
          unzip -p build/Nova_Video_v15.ipa "Payload/Y.app/$EXECUTABLE" > "$RUNNER_TEMP/ipa-executable-check"
          test -s "$RUNNER_TEMP/ipa-executable-check"
          echo "IPA packaging and executable checks passed."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Video-v15-IPA
          path: build/Nova_Video_v15.ipa
          if-no-files-found: error
          retention-days: 7
